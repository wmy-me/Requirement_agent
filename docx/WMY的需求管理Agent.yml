        delivery_methods:
        - enabled: true
          id: 9f2a7c12-3e42-4a72-9d44-4c3dbdbd9c61
          type: webapp
        form_content: |-
          ## 待审核需求治理结论

          请对本次写库清单做一次总审核。

          AI 摘要：
          - 需求名称：{{#1788319001279.structured_output.requirement_name#}}
          - 需求简述：{{#1788319001279.structured_output.requirement_summary#}}
          - 最终需求：{{#1788319001279.structured_output.final_requirement#}}
          - 处理动作：{{#1788319001279.structured_output.action#}}
          - 风险等级：{{#1788319001279.structured_output.risk_level#}}
          - 风险说明：{{#1788319001279.structured_output.risk_reason#}}
          - 版本标题：{{#1788319001279.structured_output.version_title#}}
          - 变更摘要：{{#1788319001279.structured_output.change_summary#}}
          - 目标需求ID：{{#1788319001279.structured_output.target_requirement_id#}}

          写库清单：
          1. requirement_record：记录输入渠道、输入人、需求简述、原始需求、附件摘要、输入时间
          2. requirement_master：若 action=create_new 则新建主需求
          3. requirement_version：创建或追加版本记录
          4. requirement_master：若 action=update_existing 则更新最终需求与当前版本
          5. requirement_knowledge：写入或更新向量知识
          6. task_audit_log：记录本次治理执行结果

          通过后系统将按清单顺序执行；拒绝则不写业务库，仅记录拒绝审计。
        inputs: []
        selected: false
        timeout: 3
        timeout_unit: hour
        title: 人工审核需求
        type: human-input
        user_actions:
        - button_style: default
          id: approved
          title: 通过
        - button_style: accent
          id: rejected
          title: 拒绝
