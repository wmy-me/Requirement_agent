[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "requirement-agent"
version = "0.1.0"
description = "Requirement management agent built around PostgreSQL, pgvector, and workflow orchestration."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    # FastAPI 解析 multipart/form-data（Form / UploadFile）必需。
    # 此前的缺失被本地 venv 里恰好装过掩盖了：全新安装后上传接口会直接 500。
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    "minio>=7.2.0",
    "httpx>=0.27.0",
    # 飞书回调的 AES-256-CBC 解密。此前只是其他包的传递依赖，
    # 安全相关的 import 不应依赖传递关系，故显式声明。
    "cryptography>=42.0.0",
    # 上传 PDF 的正文抽取。此前 document_parser 里有 try/except 静默降级，
    # 缺库时只有占位文案入库——向量化的就是那句占位符，检索毫无意义。
    "pypdf>=4.0.0",
    "langgraph>=1.2.11",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

# src-layout：正式业务包为 `requirement_agent`（物理位置 src/requirement_agent/）
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["requirement_agent*"]

[tool.pytest.ini_options]
# src：导入 requirement_agent.*；"."：导入根目录下的 apps / main（测试用）
pythonpath = ["src", "."]
