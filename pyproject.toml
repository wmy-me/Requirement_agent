[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "requirement-agent"
version = "0.1.0"
description = "Requirement management agent built around PostgreSQL, pgvector, and workflow orchestration."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    "minio>=7.2.0",
    "httpx>=0.27.0",
    "langgraph>=1.2.11",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

# src-layout：正式业务包为 `requirement_agent`（物理位置 src/requirement_agent/）
[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["requirement_agent*"]

[tool.pytest.ini_options]
# src：导入 requirement_agent.*；"."：导入根目录下的 apps / main（测试用）
pythonpath = ["src", "."]
