[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "requirement-agent"
version = "0.1.0"
description = "Requirement management agent built around PostgreSQL, pgvector, and workflow orchestration."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.0",
    "minio>=7.2.0",
    "mcp>=1.0.0,<2",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "fastmcp>=3.4.7",
]

[tool.setuptools]
package-dir = {"" = "."}
packages = [
    "apps",
    "apps.api",
    "apps.mcp",
    "apps.worker",
    "src",
    "src.domain",
    "src.application",
    "src.infrastructure",
    "src.infrastructure.channels",
    "src.infrastructure.db",
    "src.infrastructure.embedding",
    "src.infrastructure.storage",
    "src.infrastructure.vector",
    "src.interfaces",
    "src.interfaces.http",
    "src.interfaces.mcp",
    "tests",
    "tests.unit",
    "tests.integration",
    "tests.e2e",
]

[tool.pytest.ini_options]
pythonpath = ["."]
