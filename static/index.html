<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>需求治理 Agent · 对话式工作台</title>
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body>
    <div id="app">
      <!-- Top bar -->
      <header class="topbar">
        <div class="brand">
          <span class="brand-logo">✦</span>
          <div class="brand-text">
            <strong>需求治理 Agent</strong>
            <span class="brand-sub">对话式需求工作台</span>
          </div>
        </div>
        <div class="topbar-right">
          <span id="model-chip" class="model-chip" title="当前 LLM 模型">模型加载中…</span>
          <span id="db-pill" class="pill"><span class="dot"></span>DB</span>
          <span id="llm-pill" class="pill"><span class="dot"></span>LLM</span>
          <button id="toggle-left" class="icon-btn active" title="收起 / 展开会话栏" type="button">☰</button>
          <button id="toggle-right" class="icon-btn active" title="收起 / 展开工作台" type="button">▤</button>
        </div>
      </header>

      <div class="workspace">
        <!-- Left: recent conversations -->
        <aside id="rail-sessions" class="rail rail-sessions">
          <button id="new-chat" class="new-chat" type="button">＋ 新建对话</button>
          <div class="rail-label">最近会话</div>
          <ul id="session-list" class="session-list"></ul>
        </aside>

        <!-- Center: chat -->
        <main id="chat-pane" class="chat-pane">
          <div id="messages" class="messages"></div>

          <div class="composer-wrap">
            <div id="attach-list" class="attach-list hidden"></div>
            <form id="composer" class="composer" autocomplete="off">
              <input id="file-input" type="file" hidden multiple accept=".pdf,.doc,.docx,.txt,.md" />
              <button type="button" id="attach-btn" class="composer-btn" title="选择需求文档（可多选，发送时一起分析）">📎</button>
              <textarea id="input" rows="1" placeholder="说出你的业务需求，例如：希望登录页支持手机号 + 短信验证码，连续输错三次需锁定并记录审计日志…"></textarea>
              <button type="submit" id="send-btn" class="send-btn" title="发送" disabled>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7z"/></svg>
              </button>
            </form>
            <div class="composer-hint">Enter 发送 · Shift + Enter 换行 · 可直接上传需求文档</div>
          </div>
        </main>

        <!-- Right: workbench rail -->
        <aside id="rail-workbench" class="rail rail-workbench">
          <div class="wb-tabs">
            <button class="wb-tab active" data-tab="pending" type="button">待办<span id="pending-count" class="count-badge hidden">0</span></button>
            <button class="wb-tab" data-tab="library" type="button">需求库</button>
            <button class="wb-tab" data-tab="documents" type="button">文档库</button>
            <button class="wb-tab" data-tab="audit" type="button">审计</button>
            <button class="wb-tab" data-tab="ops" type="button">运维<span id="ops-count" class="count-badge hidden">0</span></button>
          </div>

          <section id="tab-pending" class="wb-pane active">
            <div class="pane-toolbar">
              <span>待审核需求</span>
              <button id="refresh-pending" class="link-btn" type="button">刷新</button>
            </div>
            <div id="pending-list" class="item-scroll"></div>
          </section>

          <section id="tab-documents" class="wb-pane">
            <form id="document-search" class="lib-search">
              <input id="document-q" placeholder="搜索文档 / 证据词…" />
              <button class="link-btn" type="submit">搜索</button>
            </form>
            <div class="pane-toolbar">
              <span>文档库</span>
              <button id="refresh-documents" class="link-btn" type="button">刷新</button>
            </div>
            <div id="document-list" class="item-scroll"></div>
            <div id="document-detail" class="lib-detail hidden"></div>
          </section>

          <section id="tab-audit" class="wb-pane">
            <div class="audit-status">
              <span id="audit-model" class="status-tag active">模型加载中…</span>
            </div>
            <div class="pane-toolbar">
              <span>审计事件</span>
              <button id="refresh-audit" class="link-btn" type="button">刷新</button>
            </div>
            <div id="audit-list" class="item-scroll"></div>
          </section>

          <section id="tab-ops" class="wb-pane">
            <div class="pane-toolbar">
              <span>异步队列</span>
              <button id="refresh-ops" class="link-btn" type="button">刷新</button>
            </div>
            <div id="ops-summary" class="ops-summary"></div>
            <div class="pane-toolbar">
              <span>死信事件</span>
            </div>
            <div id="ops-dead-letters" class="item-scroll"></div>
          </section>
        </aside>

        <!-- 需求库：全宽面板（点右栏「需求库」标签展开，覆盖中栏 + 右栏）-->
        <section id="library-panel" class="library-panel hidden">
          <div class="lib-head">
            <strong>需求库</strong>
            <span id="lib-count" class="status-tag"></span>
            <button id="lib-close" class="btn ghost" type="button">收起</button>
          </div>

          <div class="lib-filters">
            <input id="lib-filter-q" placeholder="检索需求名称 / 正文…" />
            <select id="lib-filter-channel"><option value="">全部渠道</option></select>
            <select id="lib-filter-status"><option value="">全部状态</option></select>
            <select id="lib-filter-domain"><option value="">全部领域</option></select>
            <select id="lib-filter-department"><option value="">全部部门</option></select>
            <label class="lib-date">提交自 <input id="lib-filter-from" type="date" /></label>
            <label class="lib-date">至 <input id="lib-filter-to" type="date" /></label>
            <button id="lib-apply" class="btn primary" type="button">查询</button>
            <button id="lib-reset" class="btn ghost" type="button">重置</button>
            <button id="lib-export" class="btn" type="button">导出 CSV</button>
          </div>

          <div class="lib-table-wrap">
            <table class="lib-table">
              <thead>
                <tr>
                  <th>需求编号</th>
                  <th>需求名称</th>
                  <th>状态</th>
                  <th>业务领域</th>
                  <th>版本</th>
                  <th>功能数</th>
                  <th>来源渠道</th>
                  <th>来源人</th>
                  <th>最近提交</th>
                </tr>
              </thead>
              <tbody id="lib-table-body"></tbody>
            </table>
          </div>
          <div id="lib-panel-detail" class="lib-detail hidden"></div>
        </section>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>
    <script src="/static/js/app.js?v=20260917-2"></script>
  </body>
</html>
